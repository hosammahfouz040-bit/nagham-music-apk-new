name: Build Nagham APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: 21

  - name: Extract ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 2 -name 'nagham-music-app-development.zip' -print -quit)
      if [ -z "$ZIP_FILE" ]; then echo "ZIP file not found"; exit 1; fi
      mkdir -p app-source
      unzip -q "$ZIP_FILE" -d app-source
      PACKAGE_FILE=$(find app-source -name package.json -not -path '*/node_modules/*' -print -quit)
      if [ -z "$PACKAGE_FILE" ]; then echo "package.json not found"; exit 1; fi
      echo "APP_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

  - name: Install dependencies
    run: cd "$APP_DIR" && npm install

  - name: Build application
    run: cd "$APP_DIR" && npm run build

  - name: Setup Android
    run: |
      cd "$APP_DIR"
      npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
        npx cap init Nagham com.nagham.music --web-dir=dist
      fi
      if [ ! -d android ]; then npx cap add android; fi
      npx cap sync android

  - name: Build APK
    run: |
      cd "$APP_DIR/android"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: nagham-music-apk
      path: app-source/**/android/app/build/outputs/apk/debug/*.apk
